[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "collection-manager"
version = "0.1.0"
description = "A local desktop catalog and rating manager for artist collections."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Collection Manager" }]
dependencies = [
  "alembic>=1.13,<2",
  "platformdirs>=4.2,<5",
  "PySide6>=6.8,<7",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "pytest-qt>=4.4,<5",
  "ruff>=0.8,<1",
]
build = ["nuitka==4.1.3", "ordered-set>=4.1", "zstandard>=0.23"]

[project.scripts]
collection-manager = "collection_manager.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/collection_manager"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
