name: Windows verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,build]"
      - name: Static checks
        run: python -m ruff check src tests
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: Build portable application
        shell: pwsh
        run: scripts/build_windows.ps1 -Python python
      - uses: actions/upload-artifact@v4
        with:
          name: CollectionManager-windows-portable
          path: dist/CollectionManager-windows-portable.zip
          if-no-files-found: error

